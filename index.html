<h1>Demo Clinic API</h1>
<p>Testing ke liye nakli clinic site. Endpoints:</p>
<ul>
<li><code>GET /api/availability?date=YYYY-MM-DD&amp;service=Dental</code></li>
<li><code>POST /api/appointments</code></li>
<li><code>GET /api/appointments?from=YYYY-MM-DD&amp;to=YYYY-MM-DD</code></li>
<li><code>PATCH /api/appointments</code></li>
</ul>
<p>Har request mein <code>X-API-Key</code> header chahiye.</p>
</body></html>
